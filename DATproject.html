<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Project Deadlines</title>
  <link rel="stylesheet" href="DATproject.css">
  <script src="DATproject.js"></script>
</head>
<body>

<!-- Admin Side Tabs -->
<div class="sidebar">
  <h2>Admin Panel</h2>
  <a href="#">Dashboard</a>
  <a href="#">Users</a>
  <a class="active">Project Deadlines</a>
  
  
</div>

<div class="main">
  <div class="header">
    <h2>Project Deadline Data</h2>
    <button class="btn-create" onclick="openModal()">+ Create Project</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Project Name</th>
        <th>Manager</th>
        <th>Progress</th>
        <th>Deadline</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="projectBody">
      <tr>
        <td>Website Development</td>
        <td>Gayatri</td>
        <td><div class="progress"><div class="fill" style="width:80%"></div></div> 80%</td>
        <td>20 Aug 2026</td>
        <td><span class="status Active">Active</span></td>
        <td>
          <button class="btn view" onclick="viewRow(this)">View</button>
          <button class="btn edit" onclick="editRow(this)">Edit</button>
          <button class="btn delete" onclick="deleteRow(this)">Delete</button>
        </td>
      </tr>
      <tr>
        <td>Mobile Application</td>
        <td>Priya</td>
        <td><div class="progress"><div class="fill" style="width:65%"></div></div> 65%</td>
        <td>10 Sep 2026</td>
        <td><span class="status Active">Active</span></td>
        <td>
          <button class="btn view" onclick="viewRow(this)">View</button>
          <button class="btn edit" onclick="editRow(this)">Edit</button>
          <button class="btn delete" onclick="deleteRow(this)">Delete</button>
        </td>
      </tr>
      
    </tbody>
  </table>
</div>

<!-- View Modal -->
<div id="viewModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3>Project Details</h3>
    <p id="viewDetails"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
