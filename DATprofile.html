<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Profile</title>
  <link rel="stylesheet" href="DATprofile.css">
</head>
<body>

<div class="sidebar">
  <h2>Admin Panel</h2>
  <a href="#">Dashboard</a>
  <a href="#">Users</a>
  <a href="#">Projects</a>
  <a href="#">Tasks</a>
  <a class="active" href="#">Profile</a>
</div>

<div class="main">
  <div class="header">
    <h2>My Profile</h2>
  </div>

  <div class="profile-container">
    <div class="profile-card">
      <div class="profile-left">
        <img id="profileImg" src="https://i.pravatar.cc/150?img=5" alt="Profile">
        <input type="file" id="imgUpload" accept="image/*" hidden>
        <button class="btn-upload" onclick="document.getElementById('imgUpload').click()">Change Photo</button>
        <h3 id="displayName">Gayatri Sharma</h3>
        <p id="displayRole">Project Manager</p>
      </div>

      <div class="profile-right">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" value="Gayatri Sharma">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" value="gayatri@company.com">
        </div>
        <div class="form-group">
          <label>Role</label>
          <input type="text" id="role" value="Project Manager">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="phone" value="+91 9876543210">
        </div>
        <div class="form-group full">
          <label>Bio</label>
          <textarea id="bio" rows="3">Passionate project manager with 3+ years experience in web development.</textarea>
        </div>
        <button class="btn-save" onclick="saveProfile()">Save Changes</button>
        <p id="msg"></p>
      </div>
    </div>
  </div>
</div>

<script src="DATprofile.js"></script>
</body>
</html>
