<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracking Dashboard</title>
    <link rel="stylesheet" href="pmttask.css">
    <script src="pmttask.js"></script>
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>TaskMaster</h2>
            </div>
            <nav class="sidebar-nav">
                <h3>Task Views</h3>
                <ul>
                    <li class="active"><a href="#">All Tasks</a></li>
                    <li><a href="#">My Tasks</a></li>
                    <li><a href="#">Backlog</a></li>
                    <li><a href="#">Completed</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h1>All Tasks Overview</h1>
                <button class="btn-primary" id="create-task-btn">+ Create Task</button>
            </header>

            <section class="board">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Task</th>
                            <th>Assigned To</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="task-list">
                        <!-- Task 1 -->
                        <tr>
                            <td class="task-name">Configure SSL Certificate</td>
                            <td class="assignee">Arjun Patel</td>
                            <td><span class="badge priority-high">High</span></td>
                            <td><span class="badge status-todo">To Do</span></td>
                            <td class="actions">
                                <button class="btn-edit">Edit</button>
                                <button class="btn-delete">Delete</button>
                            </td>
                        </tr>
                        <!-- Task 2 -->
                        <tr>
                            <td class="task-name">Design Landing Page</td>
                            <td class="assignee">Rohan Desai</td>
                            <td><span class="badge priority-medium">Medium</span></td>
                            <td><span class="badge status-progress">In Progress</span></td>
                            <td class="actions">
                                <button class="btn-edit">Edit</button>
                                <button class="btn-delete">Delete</button>
                            </td>
                        </tr>
                        <!-- Task 3 -->
                        <tr>
                            <td class="task-name">Update Privacy Policy</td>
                            <td class="assignee">Priya Sharma</td>
                            <td><span class="badge priority-low">Low</span></td>
                            <td><span class="badge status-done">Done</span></td>
                            <td class="actions">
                                <button class="btn-edit">Edit</button>
                                <button class="btn-delete">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    
</body>
</html>
